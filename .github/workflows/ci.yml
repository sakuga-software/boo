name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # One job per script, so a red check names what broke without opening the logs. The names stay
    # the same when a script changes: a required check that never reports blocks every merge.
    name: ${{ matrix.name }}
    # A runner of GitHub, free for a public repository. The self-hosted runners serve the private
    # repositories only, and a self-hosted runner on a public repository runs the code of forks.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint, script: lint }
          - { name: format, script: format }
          - { name: typecheck, script: typecheck }
          # The tests, and the coverage that they must keep.
          - { name: test, script: 'test:coverage' }
          # What npm would publish: the files of the tarball, and `boo` installed from it.
          - { name: pack, script: 'check:pack' }
          # `engines` accepts Node 22. The other jobs run the Node of .nvmrc.
          - { name: test (Node 22), script: test, node: '22' }

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Empty, so .nvmrc gives the version, unless the matrix names one.
          node-version: ${{ matrix.node }}
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The prepare script builds dist/ here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.script }}
        run: pnpm ${{ matrix.script }}
