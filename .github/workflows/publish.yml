name: Publish

# A GitHub release publishes the package on npm. The tag of the release must be the version of
# package.json with a "v" before it, for example v1.2.0.
on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing: npm trusts the OIDC token of this workflow, so the repository keeps no
  # npm token. The same token signs the provenance of the package.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    # Trusted publishing and provenance work only on a runner of GitHub.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Check the tag against the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version of package.json (expected v$version)."
            exit 1
          fi

      # The prepare script builds dist/ here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Trusted publishing needs npm 11.5.1 or later. The npm of the Node version in .nvmrc can be older.
      - name: Update npm if it is too old
        run: |
          recent() {
            node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
          }
          if ! recent; then
            echo "npm $(npm --version) is too old for trusted publishing: installing npm 11."
            npm install --global npm@^11.5.1
          fi
          recent || { echo "::error::Trusted publishing needs npm 11.5.1 or later, and npm is $(npm --version)."; exit 1; }
          npm --version

      - name: Publish
        run: npm publish
