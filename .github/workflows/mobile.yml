name: Mobile

# Each push to main that changes the phone app goes to TestFlight:
# - The native side changed (a new fingerprint): EAS builds the app with the `production` profile and
#   submits it to TestFlight.
# - Only the JavaScript changed: a build with the same fingerprint is on TestFlight, or on its way
#   there, so an update on the `production` channel reaches it, with no new build and no review by Apple.
# A manual run builds and submits, whatever changed.
#
# Secrets: EXPO_TOKEN, an access token of a robot of the Expo account sakuga-software. The submission
# uses the App Store Connect API key that EAS keeps for the app, so no Apple secret is here.
on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/core/src/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One delivery at a time, in the order of the pushes: a later update must not go out before an
  # earlier one.
  group: mobile
  cancel-in-progress: false

jobs:
  deliver:
    name: TestFlight
    # A runner of GitHub: see ci.yml. The build itself runs on the servers of EAS.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 21.0.2
          token: ${{ secrets.EXPO_TOKEN }}

      # A finished build is not always on TestFlight: its submission can fail. A build or a submission
      # still in progress is on its way, and it gets the update at its first start.
      # - A submission of this fingerprint finished or runs, or a build of it runs: publish an update.
      # - Else: build and submit. A finished build whose submission failed does not count.
      # The CLI gives no submission, so the step reads them from the GraphQL API of Expo.
      # `set -euo pipefail` and `jq -e` stop the job on an error. Without them, an empty answer reads
      # as "no build", and each push gives a new build.
      - name: Is this fingerprint on TestFlight, or on its way?
        id: reach
        if: github.event_name == 'push'
        shell: bash
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROJECT_ID: c99df17f-1fdf-424f-b5bf-731bd1b0d36d
        run: |
          set -euo pipefail
          hash=$(eas fingerprint:generate --platform ios --json --non-interactive | jq -er '.hash')
          query='query($app: String!) { app { byId(appId: $app) { submissions(filter: { platform: IOS }, offset: 0, limit: 50) { status submittedBuild { fingerprint { hash } } } } } }'
          submitted=$(curl -sf https://api.expo.dev/graphql -H "authorization: Bearer $EXPO_TOKEN" -H 'content-type: application/json' \
            -d "$(jq -nc --arg q "$query" --arg app "$PROJECT_ID" '{query: $q, variables: {app: $app}}')" |
            jq -e --arg hash "$hash" '[.data.app.byId.submissions[]
              | select(.submittedBuild.fingerprint.hash == $hash)
              | select(.status | IN("FINISHED", "IN_PROGRESS", "IN_QUEUE", "AWAITING_BUILD"))] | length')
          running=$(eas build:list --platform ios --build-profile production --fingerprint-hash "$hash" \
            --limit 10 --json --non-interactive |
            jq -e '[.[] | select(.status | ascii_upcase | IN("NEW", "IN_QUEUE", "IN_PROGRESS"))] | length')
          echo "fingerprint $hash: $submitted submissions finished or on their way, $running builds running"
          if [ "$submitted" -gt 0 ] || [ "$running" -gt 0 ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish an update
        if: steps.reach.outputs.update == 'true'
        working-directory: packages/mobile
        # The commit message goes through the environment: text in the template could run as code.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          eas update --channel production --platform ios --non-interactive \
            --message "$(printf '%s' "$COMMIT_MESSAGE" | head -1)"

      - name: Build and submit to TestFlight
        if: github.event_name == 'workflow_dispatch' || steps.reach.outputs.update == 'false'
        working-directory: packages/mobile
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
